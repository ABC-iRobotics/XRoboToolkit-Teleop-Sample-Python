left:
  type: DexPilot # or vector
  urdf_path: unitree/dex3/unitree_dex3_left.urdf

  # Target refers to the retargeting target, which is the robot hand
  target_joint_names: 
    [
      "left_hand_thumb_0_joint",
      "left_hand_thumb_1_joint",
      "left_hand_thumb_2_joint",
      "left_hand_middle_0_joint",
      "left_hand_middle_1_joint",
      "left_hand_index_0_joint",
      "left_hand_index_1_joint",
    ]
  
  # vector conf
  #target_origin_link_names: ["base_link_thumb","base_link_index","base_link_middle"]
  #target_task_link_names: ["thumb_tip","index_tip","middle_tip"]
  #target_link_human_indices: [[0, 0, 0], [4, 8, 12]]

  # for DexPilot type
  wrist_link_name: "base_link"
  finger_tip_link_names: [ "thumb_tip",  "index_tip", "middle_tip"]
  target_link_human_indices: [[9,  14,  9, 0,  0,  0],
                               [ 4,  4, 14, 4, 9,  14]]

  # Scaling factor for vector retargeting only
  # For example, Allegro is 1.6 times larger than normal human hand, then this scaling factor should be 1.6
  scaling_factor: 1.0
  # A smaller alpha means stronger filtering, i.e. more smooth but also larger latency
  low_pass_alpha: 0.5

right:
  type: DexPilot # or vector
  urdf_path: unitree/dex3/unitree_dex3_right_retarget.urdf

  # Target refers to the retargeting target, which is the robot hand
  target_joint_names: 
    [
      "right_hand_thumb_0_joint",
      "right_hand_thumb_1_joint",
      "right_hand_thumb_2_joint",
      "right_hand_index_0_joint",
      "right_hand_index_1_joint",
      "right_hand_middle_0_joint",
      "right_hand_middle_1_joint",
    ]

  # vector conf
  #target_origin_link_names: ["base_link_thumb","base_link_middle","base_link_index"]
  #target_task_link_names: ["thumb_tip","middle_tip","index_tip"]
  #target_link_human_indices: [[0, 0, 0], [4, 8, 12]]

  # for DexPilot type
  # Dex3 URDF naming: "index_joint" = physical 2nd finger, "middle_joint" = physical pointer.
  # Swap human indices 8 (pointer) <-> 12 (2nd finger) so the correct human finger drives each.
  wrist_link_name: "base_link"
  finger_tip_link_names: [ "thumb_tip",  "index_tip", "middle_tip"]
  target_link_human_indices: [[9,  14,  9, 0,  0,  0],
                               [ 4,  4, 14, 4, 9,  14]]

  # Scaling factor for vector retargeting only
  # For example, Allegro is 1.6 times larger than normal human hand, then this scaling factor should be 1.6
  scaling_factor: 1.0
  # A smaller alpha means stronger filtering, i.e. more smooth but also larger latency
  low_pass_alpha: 0.5
